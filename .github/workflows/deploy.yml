name: Deploy to AWS Lambda

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.23' # Uses Go 1.23 as specified in go.mod

      - name: Build and package
        # make package triggers make build, generating a statically linked 
        # binary named bootstrap and zips it into deployment.zip
        run: make package
        
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Deploy to Lambda
        # Note: Ensure the function-name matches your actual AWS Lambda function name.
        # Ensure that you have already created the function in AWS.
        run: |
          aws lambda update-function-code \
            --function-name stocet-core-service \
            --zip-file fileb://deployment.zip
